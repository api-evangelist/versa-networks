aid: versa-networks
name: Versa Networks
description: >-
  Versa Networks is a SASE (Secure Access Service Edge), SD-WAN and SSE vendor whose
  VersaONE platform unifies networking and security services — Secure SD-WAN, Zero
  Trust Network Access (ZTNA), CASB, Secure Web Gateway, DLP, NGFW and Advanced
  Threat Protection — delivered on-premises, as private SASE, sovereign SASE, or
  cloud-managed via Versa Concerto. For programmatic management it exposes the
  appliance-hosted Versa Director REST API and Versa Analytics REST API (OAuth2 or
  HTTP Basic, Swagger-documented per release), a partner-tier Terraform provider for
  infrastructure-as-code, and a first-party Model Context Protocol server ("Zero
  Trust MCP Server") that surfaces 67 read-only Director/Concerto query tools to AI
  agents.
