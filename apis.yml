apis:
- name: Versa Director REST API
  description: >-
    Management and orchestration REST API of the Versa Director control plane —
    SD-WAN workflows, appliance/device management, templates and device groups,
    dashboard/live status, health, assets, audit logs and fault management.
    OAuth2 password-grant (recommended) or HTTP Basic; offset/limit pagination;
    JSON error envelope. Swagger UI is served from a running Director on port 9182.
  humanURL: https://docs.versa-networks.com/Management_and_Orchestration/Versa_Director/Director_REST_APIs/Versa_Director_REST_API_Overview
  baseURL: https://docs.versa-networks.com/Management_and_Orchestration/Versa_Director/Director_REST_APIs/Versa_Director_REST_API_Overview
  x-base-pattern: 'https://<director-host>:9182 (Basic) | :9183 (OAuth) — appliance-hosted, per deployment'
  tags:
  - SD-WAN
  - SASE
  - Networking
  - Management
  - Orchestration
