method: searched
status: published
source: https://github.com/versa-networks/vnmcpserver
name: Versa API MCP Server
description: First-party Model Context Protocol server published by Versa Networks that exposes a read-only
  subset of the Versa Director / Concerto REST API as MCP tools. It authenticates to a Versa Director
  using the OAuth2 password grant (client_id + client_secret + username/password against /auth/token)
  and lets an agent query appliance status, device/template workflows, device groups, assets, health,
  and alarms. Self-hosted (clone + `uv sync`); ships STDIO, Director SSE, and Concerto SSE entrypoints.
  The maintainer notes the implementation omits many security checks and should run only in a trusted
  environment.
repo: https://github.com/versa-networks/vnmcpserver
product_page: https://versa-networks.com/products/zero-trust-mcp-server/
license: proprietary (Versa Networks, use/modify permitted, redistribution prohibited)
runtime:
  language: python
  requires_python: '>=3.11'
  package_manager: uv
  dependencies:
  - mcp[cli]>=1.6.0
  - pyjwt>=2.10.1
  - requests>=2.32.3
server:
  name: Versa API Server
  transports:
  - transport: stdio
    entrypoint: main.py
    install: uv run mcp install main.py
  - transport: sse
    entrypoint: main_sse.py
    note: Versa Director integration; default SSE at http://127.0.0.1:8000/sse
  - transport: sse
    entrypoint: main_concerto_sse.py
    note: Versa Concerto integration
  hosted_url: null
auth:
  scheme: oauth2-password
  token_endpoint: /auth/token
  env:
  - VN_CLIENT_ID
  - VN_CLIENT_SECRET
  bearer: true
wraps_api: Versa Director / Concerto REST API
tool_count: 67
