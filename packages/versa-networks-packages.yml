notes:
  - The Versa Director/Analytics REST APIs are appliance-hosted; the OpenAPI/Swagger spec is exported from a running Director instance (port 9182 /docs/swagger-ui.html) and is not published for public download.
  - Other repos in the versa-networks GitHub org (openstack-java-sdk, libcli, wazuh) are forks/utilities, not first-party clients of the Versa REST API, so are excluded from official packages.
  - github.com/versa-networks/devops holds example automation scripts, not a released package.
